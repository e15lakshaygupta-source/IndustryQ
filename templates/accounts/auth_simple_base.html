{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Account security{% endblock %} | INDUSTRIQ</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=20261106">
</head>
<body class="auth-page">
  <main class="auth-simple-layout">
    <a class="auth-simple-brand" href="{% url 'login' %}">
      <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><rect x="5" y="16" width="4" height="10" rx="1" fill="currentColor"/><rect x="11" y="11" width="4" height="15" rx="1" fill="currentColor"/><rect x="17" y="6" width="4" height="20" rx="1" fill="currentColor"/><rect x="23" y="13" width="4" height="13" rx="1" fill="currentColor"/></svg></span>
      <span class="auth-wordmark">INDUSTRI<span>Q</span><small>OPERATIONS, CONNECTED</small></span>
    </a>
    <section class="auth-simple-card">
      {% block content %}{% endblock %}
    </section>
    <p class="auth-simple-footer">Protected workspace · Authorized access only</p>
  </main>
</body>
</html>
